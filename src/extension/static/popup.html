<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ReFrame</title>
    <style>
      :root { color-scheme: dark; }
      body {
        width: 280px;
        margin: 0;
        padding: 12px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #f4f5f7;
        background: #111318;
      }
      h1 { font-size: 14px; margin: 0 0 4px; }
      .hint { color: #a6acb8; margin: 0 0 12px; font-size: 12px; }
      .row { display: flex; gap: 8px; margin-bottom: 12px; }
      button {
        font: inherit;
        color: #f4f5f7;
        background: #252a33;
        border: 1px solid #373d49;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover { border-color: #7c8cff; }
      button:focus-visible { outline: 2px solid #7c8cff; }
      .state { color: #a6acb8; }
      .state-on { color: #34d399; }
      pre {
        max-height: 160px;
        overflow: auto;
        font-size: 11px;
        color: #a6acb8;
        background: #1b1e25;
        border: 1px solid #373d49;
        border-radius: 6px;
        padding: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>ReFrame <span style="color: #a6acb8; font-weight: 400">spike</span></h1>
    <p class="hint">Works on youtube.com/watch only. Crop of a composited video — masked areas cannot be restored.</p>
    <p>Status: <span id="status" class="state">…</span></p>
    <div class="row">
      <button id="toggle" type="button">Enable ReFrame</button>
      <button id="copy-log" type="button">Copy log</button>
    </div>
    <pre id="log-preview">No log entries yet.</pre>
    <script type="module" src="popup.js"></script>
  </body>
</html>
